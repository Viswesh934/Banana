name: Deploy Banana to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy Lambda Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC Claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "import sys, json, base64; token=sys.argv[1]; payload=token.split('.')[1]; payload += '=' * (-len(payload) % 4); data=json.loads(base64.urlsafe_b64decode(payload)); print('=== GITHUB OIDC TOKEN CLAIMS ==='); print('sub:', data.get('sub')); print('aud:', data.get('aud')); print('iss:', data.get('iss')); print('ref:', data.get('ref')); print('repository:', data.get('repository'))" "$TOKEN"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136172187126:role/OIDC
          aws-region: ap-south-1
          role-session-name: GitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'banana-graph-brain' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Create ECR repository if it does not exist
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY"

          # Build container image from Dockerfile.lambda
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f Dockerfile.lambda .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Push both commit SHA tag and latest tag
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to AWS Lambda
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'banana-graph-brain' }}
          IMAGE_TAG: ${{ github.sha }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME || 'banana-graph-brain' }}
        run: |
          echo "Updating Lambda function: $LAMBDA_FUNCTION_NAME with image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Waiting for function update to stabilize..."
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Optional Health Check
        if: ${{ env.LAMBDA_FUNCTION_URL != '' }}
        env:
          LAMBDA_FUNCTION_URL: ${{ secrets.LAMBDA_FUNCTION_URL }}
        run: |
          echo "Pinging Lambda Function URL health check..."
          curl -fsS -X POST "$LAMBDA_FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -d '{"action": "health"}'
